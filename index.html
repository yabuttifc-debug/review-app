<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="復習">
  <title>受験復習アプリ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 今日の復習 -->
<div class="page active" id="page-today">
  <div class="page-header">
    <h1>今日の復習 <span id="today-badge" class="badge badge-danger" style="display:none">0</span></h1>
    <div class="subtitle" id="today-date"></div>
  </div>
  <div class="today-section">
    <div id="today-summary"></div>
    <div id="today-list"></div>
  </div>
</div>

<!-- 登録 -->
<div class="page" id="page-register">
  <div class="page-header">
    <h1>間違い登録</h1>
    <div class="subtitle">解けなかった問題を記録しよう</div>
  </div>
  <div class="register-form">

    <div class="form-section">
      <h3>教科</h3>
      <div class="radio-group" id="subject-radios"></div>
    </div>

    <div class="form-section">
      <h3>教材</h3>
      <div class="radio-group" id="type-radios"></div>
    </div>

    <div class="form-section">
      <h3>回数・問題番号</h3>
      <div class="select-row">
        <div class="select-group">
          <label>回数</label>
          <select id="round"></select>
        </div>
        <div class="select-group">
          <label>問題番号</label>
          <select id="problemNumber"></select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>メモ（任意）</h3>
      <textarea class="memo-input" id="memo" placeholder="間違えた理由・ポイントなど"></textarea>
    </div>

    <button class="btn-register" onclick="registerProblem()">
      ✏️ 間違い問題を登録
    </button>

  </div>
</div>

<!-- 問題一覧 -->
<div class="page" id="page-list">
  <div class="page-header">
    <h1>問題一覧</h1>
  </div>
  <div class="list-section">
    <div class="filter-row">
      <button class="filter-chip active" data-filter="all" onclick="setListFilter('all')">すべて</button>
      <button class="filter-chip" data-filter="active" onclick="setListFilter('active')">復習中</button>
      <button class="filter-chip" data-filter="mastered" onclick="setListFilter('mastered')">マスター</button>
      <button class="filter-chip" data-filter="算数" onclick="setListFilter('算数')">🔢 算数</button>
      <button class="filter-chip" data-filter="国語" onclick="setListFilter('国語')">📖 国語</button>
      <button class="filter-chip" data-filter="理科" onclick="setListFilter('理科')">🔬 理科</button>
      <button class="filter-chip" data-filter="社会" onclick="setListFilter('社会')">🌏 社会</button>
    </div>
    <div id="problem-list"></div>
  </div>
</div>

<!-- 統計 -->
<div class="page" id="page-stats">
  <div class="page-header">
    <h1>統計</h1>
  </div>
  <div class="stats-section">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="value" id="stat-total">0</div>
        <div class="label">登録問題数</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-today" style="color:var(--danger)">0</div>
        <div class="label">今日の復習</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-mastered" style="color:var(--success)">0</div>
        <div class="label">マスター済み</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-ongoing" style="color:var(--warning)">0</div>
        <div class="label">復習中</div>
      </div>
    </div>
    <div class="subject-stats" id="subject-stats"></div>
  </div>
</div>

<!-- ナビゲーション -->
<nav class="nav-bar">
  <button class="nav-btn active" id="nav-today" onclick="showPage('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    今日
    <span id="today-badge-nav" class="badge badge-danger" style="display:none;position:absolute;top:6px;right:calc(50% - 20px);font-size:9px;min-width:16px;height:16px;padding:0 4px"></span>
  </button>
  <button class="nav-btn" id="nav-register" onclick="showPage('register')" style="position:relative">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="16"/>
      <line x1="8" y1="12" x2="16" y2="12"/>
    </svg>
    登録
  </button>
  <button class="nav-btn" id="nav-list" onclick="showPage('list')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="8" y1="6" x2="21" y2="6"/>
      <line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/>
      <line x1="3" y1="12" x2="3.01" y2="12"/>
      <line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    一覧
  </button>
  <button class="nav-btn" id="nav-stats" onclick="showPage('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="20" x2="18" y2="10"/>
      <line x1="12" y1="20" x2="12" y2="4"/>
      <line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
    統計
  </button>
</nav>

<!-- トースト通知 -->
<div class="toast" id="toast"></div>

<script>
  // 今日の日付表示
  const d = new Date();
  const weekdays = ['日','月','火','水','木','金','土'];
  document.getElementById('today-date').textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
</script>
<script src="app.js"></script>
</body>
</html>
